services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-almer}
      POSTGRES_USER: ${POSTGRES_USER:-almer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-almer-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-almer} -d ${POSTGRES_DB:-almer}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: src/backend/Almer.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-almer};Username=${POSTGRES_USER:-almer};Password=${POSTGRES_PASSWORD:-almer-dev-password}
      Jwt__Key: ${Jwt__Key:-development-key-at-least-32-characters-long}
      DataProtection__KeyPath: /app/data-protection-keys
    volumes:
      - data-protection-keys:/app/data-protection-keys
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./src/frontend
    ports: ["4173:80"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  data-protection-keys:

